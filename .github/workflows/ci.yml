name: ci

on:
  push:
    branches: [main]
  pull_request:
  # For the `drift` job below only — it must not run on a PR, and a schedule
  # cannot be triggered by hand when you want to check it.
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

# Least privilege: these jobs only read the tree.
permissions:
  contents: read

# The EVENT is part of the group, and cancellation is limited to PRs.
#
# `github.ref` alone is not enough: on a `schedule` event it is the DEFAULT
# BRANCH ref — the same value a push to main has — so a merge landing during
# the Monday drift run would cancel it. A cancelled run is not a failure: it
# reports nothing and looks like nothing happened, which is precisely how a
# drift signal stops arriving without anyone noticing. That is the same failure
# the drift job exists to prevent, arriving by another route. (gold-man, r1 O3.)
#
# cancel-in-progress is kept for pull_request, where a superseded run proves
# nothing about the head that replaced it, and dropped everywhere else, where
# each commit deserves its own verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# auto-agents had no automated gate. Every suite ran only where someone happened
# to run it, and `tests/run-all.sh` already knows how to turn a silent abort into
# a loud failure — it parses the summary line and treats its ABSENCE as a hard
# failure. CI does not reimplement that; it supplies the environment and lets the
# runner be the judge.
jobs:
  lua:
    # Runs on every event, including the scheduled one, where it re-verifies the
    # pin. Same job, same steps, every trigger — see the note under `on:` above.
    runs-on: ubuntu-latest
    # No pty suite here (auto-core's timeout exists for its pty deadlock todo;
    # this repo has no tests/ui). This bounds a job that hangs for any other
    # reason rather than letting it burn the runner's full allowance.
    timeout-minutes: 15
    steps:
      # Pinned by commit SHA, not by tag: a tag can be moved to different code
      # under the same name.
      #
      # Deliberately NO fetch-depth: 0, and no step that manufactures a local
      # default branch. auto-core's workflow needs both because its suites read
      # this repository's own refs. These suites do not: a grep across the whole
      # test tree returns zero uses of default_branch / local_branch_exists /
      # list_branches, and the git work in diff_panel_labels_spec builds
      # SYNTHETIC repos in tempdirs (`git init --bare`, `worktree add`) rather
      # than inspecting the checkout.
      #
      # That deletion is not only smaller — it removes the defect CLASS. The
      # branch step was the one thing in this workflow that behaved differently
      # per trigger entry (actions/checkout leaves a detached HEAD on
      # pull_request and checks the branch out on push, so `git branch --force
      # main` exits 128 there under bash -e). With it gone, `push` and
      # `pull_request` run identical code, and the entry whose first firing is
      # the merge is no longer an entry that can fail on its own.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install neovim
        env:
          # Pinned by VERSION AND CHECKSUM. A GitHub release asset can be
          # replaced under the same tag and name, so the version alone is not
          # reproducible; the SHA-256 is the real pin. v0.12.5 is the version
          # these suites were verified against locally. Recompute when bumping.
          NVIM_VERSION: "v0.12.5"
          NVIM_SHA256: "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
        run: |
          # --retry: a transient network blip should not fail a PR for reasons
          # unrelated to its change.
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # All pinned by commit, so an upstream change cannot become a mystery
      # failure on an unrelated PR here. The cost of that pin — a consumer
      # frozen against its dependency can never observe an upstream regression —
      # is paid by the `drift` job below, not by weakening this one.
      - name: install plugin dependencies
        env:
          AUTO_CORE_REF: "bc4d998bc22f0644b80e3e89cfe3e1b92d71d32a"  # main @ v0.2.15
          WORKTREE_REF:  "1aedccca735b42b43b68f4e4f246669075ce03ae"
          PLENARY_REF:   "74b06c6c75e4eeb3108ec01852001636d85a932b"
        run: ./.github/install-deps.sh

      # The suite has clipboard assertions (28c/28g) that call setreg("+", ...)
      # and read it back. A GitHub runner has NO clipboard provider, so those
      # writes go nowhere and three cells fail — green locally, red here, for a
      # reason that is the ENVIRONMENT rather than the code.
      #
      # Fixed on the CI side rather than by weakening the tests: xclip gives
      # nvim a provider, xvfb-run gives xclip a display. The suite is unchanged
      # and still asserts the real behaviour.
      - name: install a clipboard provider (for the setreg("+") assertions)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xclip xvfb

      # Named "assert", not "verify", because it CAN fail: it compares the
      # running nvim against the pin. A step named "verify" that only prints a
      # version and checks a directory exists is the present-and-blind shape —
      # it converts "nobody checked" into "checked and fine".
      - name: assert the toolchain matches the pin
        env:
          NVIM_VERSION: "v0.12.5"
        run: |
          got="$(nvim --version | head -1 | awk '{print $2}')"
          echo "nvim: $got (pinned $NVIM_VERSION)"
          test "$got" = "$NVIM_VERSION"
          test -d "$HOME/.local/share/nvim/lazy/plenary.nvim"

      - name: tests/run-all.sh
        run: xvfb-run -a ./tests/run-all.sh

  # CONSUMER DRIFT (gold-man r0, O1).
  #
  # The stated reason auto-core got CI first is that a regression there reaches
  # five consumers before anyone notices — and a consumer pinned to a frozen
  # auto-core is precisely the thing that cannot notice. Both properties are
  # wanted and they conflict, so they are split rather than traded:
  # `lua` pins and gates, this resolves auto-core at its DEFAULT BRANCH.
  #
  # Schedule and manual dispatch ONLY — deliberately not `push`. On push it
  # would redden the merge run for an upstream change that has nothing to do
  # with the PR being merged, and it would put a code path on the merge that no
  # PR run ever exercised. Weekly is enough to catch drift while it is still
  # cheap to fix, and `workflow_dispatch` means you can ask the question the
  # moment you suspect the answer.
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install neovim
        env:
          NVIM_VERSION: "v0.12.5"
          NVIM_SHA256: "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The ONE difference from `lua`: auto-core rides its default branch.
      # Everything else — including the other two pins — stays fixed, so a
      # failure here names auto-core and not "something moved".
      - name: install plugin dependencies (auto-core at HEAD)
        env:
          AUTO_CORE_REF: ""   # empty => default branch
          WORKTREE_REF:  "1aedccca735b42b43b68f4e4f246669075ce03ae"
          PLENARY_REF:   "74b06c6c75e4eeb3108ec01852001636d85a932b"
        run: ./.github/install-deps.sh

      - name: install a clipboard provider (for the setreg("+") assertions)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xclip xvfb

      - name: report which auto-core is under test
        run: |
          siblings="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          git -C "$siblings/auto-core.nvim/main" log --oneline -1

      - name: tests/run-all.sh
        run: xvfb-run -a ./tests/run-all.sh
